<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portfolio Pierre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600&family=Syne:wght@500;600;700&display=swap">
<style>
/* Layout: crème sobre, expressivité portée par des formes géométriques pastel (lettres, boutons, couvertures) */
:root{
  color-scheme: light;
  --cream:#F3EDE2; --paper:#FAF6EE; --ink:#211F2C; --ink-2:#5E596B; --line:#DCD3C4;
  --lilac:#C9BBF3; --mint:#B6E0C6; --peach:#F7C2A3; --butter:#F2DC86; --sky:#B5D1EE; --rose:#F2B7C7;
  --f-display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"Syne", "Helvetica Neue", Arial, sans-serif;
  --r:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
img,svg{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--f-mono);font-weight:600;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
h1,h2,h3{font-family:var(--f-display);font-weight:650;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}

/* Glyphes géométriques qui remplacent des lettres */
.gl{display:inline-block;width:.56em;height:.56em;margin:0 .02em;vertical-align:-.01em}
.gl.up{width:.72em;height:.72em}
.gl-o{border-radius:50%}
.gl-h{border-radius:0 999px 999px 0;width:.32em}
.gl-q{border-radius:0 0 0 100%}
.gl-s{border-radius:.08em;transform:rotate(45deg) scale(.82)}
.gl-x{clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.c-lilac{background:var(--lilac)}.c-mint{background:var(--mint)}.c-peach{background:var(--peach)}.c-butter{background:var(--butter)}.c-sky{background:var(--sky)}.c-rose{background:var(--rose)}.c-ink{background:var(--ink)}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:transparent;padding-block:16px;pointer-events:none}
header.top .brand,header.top nav.main{pointer-events:auto}
/* Voile progressif : flou en paliers + crème qui s'efface en douceur, sans frontière */
.veil{position:absolute;z-index:-1;left:0;right:0;top:calc(-1 * env(safe-area-inset-top,0px));height:calc(100% + env(safe-area-inset-top,0px) + 120px);pointer-events:none;
  background:linear-gradient(to bottom,rgba(243,237,226,.82) 0%,rgba(243,237,226,.76) 18%,rgba(243,237,226,.64) 34%,rgba(243,237,226,.48) 50%,rgba(243,237,226,.31) 64%,rgba(243,237,226,.17) 77%,rgba(243,237,226,.07) 89%,rgba(243,237,226,0) 100%)}
.veil i{position:absolute;inset:0}
.veil i:nth-child(1){-webkit-backdrop-filter:blur(.6px);backdrop-filter:blur(.6px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 50%,transparent 95%);mask-image:linear-gradient(to bottom,#000 0%,#000 50%,transparent 95%)}
.veil i:nth-child(2){-webkit-backdrop-filter:blur(1.4px);backdrop-filter:blur(1.4px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 35%,transparent 72%);mask-image:linear-gradient(to bottom,#000 0%,#000 35%,transparent 72%)}
.veil i:nth-child(3){-webkit-backdrop-filter:blur(2.6px);backdrop-filter:blur(2.6px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 20%,transparent 50%);mask-image:linear-gradient(to bottom,#000 0%,#000 20%,transparent 50%)}

header.top .lang{background:var(--cream)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:650;font-size:1.05rem}
.brand svg{width:40px;height:40px;flex:none}
.brand small{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:400}
nav.main{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
/* Boutons (V1) : pilule avec point, le point devient losange au survol */
.pill{display:inline-flex;align-items:center;gap:11px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:14px 26px;font:500 1rem var(--f-body);text-decoration:none;cursor:pointer;transition:transform .2s ease, background .2s}
.pill:hover{transform:translateY(-4px)}
.pill::before{content:"";width:12px;height:12px;flex:none;border-radius:50%;background:var(--paper);transition:border-radius .25s, transform .25s}
.pill:hover::before{border-radius:2px;transform:rotate(45deg)}
.pill.on::before{background:var(--butter)}
.pill.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pill.ghost::before{background:var(--ink)}
.pill[aria-disabled]{opacity:.55;cursor:default}
.pill[aria-disabled]:hover{transform:none}
.pill[aria-disabled]:hover::before{border-radius:50%;transform:none}
.lang{display:inline-flex;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ink);padding:3px;margin-left:4px}
.lang button{border:0;background:transparent;font:600 .9rem var(--f-mono);padding:10px 14px;border-radius:999px;cursor:pointer;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Hero plein écran, formes sur toute la surface */
.hero{position:relative;overflow:hidden;min-height:calc(100vh - 90px);min-height:calc(100svh - 90px);display:grid;place-items:center;text-align:center;padding-block:56px}
.hero .wrap{position:relative;z-index:1;width:100%}
.hero h1{font-size:clamp(1.9rem,7.2vw,6.2rem);font-weight:650;max-width:16ch;margin:0 auto;line-height:1.08}
.rot{display:inline-grid;height:1.18em;clip-path:inset(0 -.2em);margin:0 .06em}
.rot span{grid-area:1/1;padding:0 .22em;border-radius:.3em;white-space:nowrap;line-height:1.18;transform:translateY(115%);justify-self:center;will-change:transform}
.rot span.on{transform:translateY(0)}
.hero .sub{margin-top:30px;display:flex;gap:10px 22px;justify-content:center;flex-wrap:wrap}
.hero .sub span{display:inline-flex;align-items:center;gap:8px}
.hero .sub i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hero .actions{margin-top:38px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.ins{display:inline-block;vertical-align:-.08em;margin:0 .04em}
.ins-star{width:.78em;height:.78em;background:var(--butter);clip-path:polygon(50.0% 0.0%,60.7% 24.1%,85.4% 14.6%,75.9% 39.3%,100.0% 50.0%,75.9% 60.7%,85.4% 85.4%,60.7% 75.9%,50.0% 100.0%,39.3% 75.9%,14.6% 85.4%,24.1% 60.7%,0.0% 50.0%,24.1% 39.3%,14.6% 14.6%,39.3% 24.1%);animation:spin 14s linear infinite}
.ins-img{width:1.7em;height:.82em;border-radius:999px;overflow:hidden;vertical-align:-.1em}
.ins-img svg{width:100%;height:100%;display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sections */
section.block{padding-block:clamp(56px,8vw,96px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:34px;padding-bottom:16px;border-bottom:1.5px solid var(--ink)}
.sec-head h2{font-size:clamp(1.7rem,3.6vw,2.8rem);max-width:22ch}

/* Compétences */
.skills{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:40px}
.skills .intro p{color:var(--ink-2);max-width:40ch;margin-top:14px}
.acc .sk{border-bottom:1px solid var(--line);outline:none}
.acc .sk-head{display:flex;align-items:center;gap:16px;padding:20px 0;font-family:var(--f-display);font-size:clamp(1.15rem,2vw,1.45rem);font-weight:600;transition:padding .35s}
.acc .sk-head .shape{width:26px;height:26px;flex:none;transition:transform .35s}
.acc .sk-head .plus{margin-left:auto;font-family:var(--f-mono);font-weight:400;font-size:1.1rem;transition:transform .3s}
.acc .bw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.6,0,.2,1)}
.acc .body{overflow:hidden;min-height:0;padding-left:42px;display:grid;gap:14px}
.acc .body .tags{padding-bottom:22px}
.acc .body p{color:var(--ink-2);max-width:56ch}
.acc .sk:hover .bw,.acc .sk:focus-visible .bw,.acc .sk.open .bw{grid-template-rows:1fr}
.acc .sk:hover .shape,.acc .sk:focus-visible .shape,.acc .sk.open .shape{transform:rotate(90deg)}
.acc .sk:hover .plus,.acc .sk:focus-visible .plus,.acc .sk.open .plus{transform:rotate(45deg)}
.acc .sk:focus-visible .sk-head{text-decoration:underline;text-underline-offset:4px}
@media (hover:none){.acc .sk{cursor:pointer}}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:500 .76rem var(--f-mono);padding:5px 10px;border-radius:999px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}

/* Stack */
.stack{background:var(--ink);color:var(--paper);padding-block:clamp(56px,7vw,84px);overflow:hidden}
.stack .sec-head{border-color:rgba(250,246,238,.25)}
.stack .mono{color:#B9B3C6}
.legend{display:flex;gap:8px 20px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:8px;font:400 .78rem var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:#D8D2E2}
.marquee{display:grid;gap:12px;margin-top:6px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:12px;width:max-content;animation:slide 48s linear infinite}
.track.rev{animation-direction:reverse;animation-duration:56s}
.marquee:hover .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 18px 12px 14px;border-radius:999px;background:#2E2B3B;font:600 1rem var(--f-mono);letter-spacing:.01em;white-space:nowrap;transition:background .2s,color .2s}
.chip:hover{background:var(--paper);color:var(--ink)}
.chip i{width:16px;height:16px;display:inline-block;flex:none}
.sh-o{clip-path:polygon(50.0% 0.0%,60.7% 24.1%,85.4% 14.6%,75.9% 39.3%,100.0% 50.0%,75.9% 60.7%,85.4% 85.4%,60.7% 75.9%,50.0% 100.0%,39.3% 75.9%,14.6% 85.4%,24.1% 60.7%,0.0% 50.0%,24.1% 39.3%,14.6% 14.6%,39.3% 24.1%)}.sh-q{border-radius:0 0 0 100%}.sh-t{clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0 50%)}.sh-s{border-radius:3px;transform:rotate(45deg) scale(.8)}
@media (prefers-reduced-motion:reduce){.track{animation:none;flex-wrap:wrap;width:auto}.track[aria-hidden]{display:none}.marquee{mask-image:none}}

/* Index projets */
.index{border-top:1.5px solid var(--ink)}
.row{display:grid;grid-template-columns:170px minmax(0,1fr) 170px;align-items:center;gap:12px;padding:14px 0;border-bottom:1.5px solid var(--ink);text-decoration:none}
.row .meta{font:400 .74rem var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.row .meta.r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.row .name{display:flex;justify-content:center;align-items:center;font-family:var(--f-display);font-weight:780;font-size:clamp(2.1rem,7.4vw,5.6rem);line-height:1;letter-spacing:-.03em;text-transform:uppercase;min-width:0}
.row .pop{display:inline-block;width:0;height:.72em;border-radius:999px;overflow:hidden;transition:width .5s cubic-bezier(.6,0,.2,1),margin .5s cubic-bezier(.6,0,.2,1);flex:none}
.row .pop svg{width:2.3em;height:.72em;display:block;transform:scale(.4);transition:transform .5s cubic-bezier(.6,0,.2,1)}
.row:hover .pop,.row:focus-visible .pop{width:2.3em;margin:0 .18em}
.row:hover .pop svg,.row:focus-visible .pop svg{transform:scale(1)}
.row .demo{font:500 .62rem var(--f-mono);padding:3px 7px;border-radius:999px;background:var(--butter);color:var(--ink);white-space:nowrap}
@media (hover:none){.row .pop{width:1.4em;margin:0 .14em}.row .pop svg{transform:scale(1);width:1.4em}}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr)}.row .meta{display:none}.row .name{font-size:clamp(1.8rem,10vw,3rem)}}
.more{margin-top:26px;display:flex;justify-content:flex-end}

/* CTA band */
.cta{background:var(--lilac);border-radius:var(--r);padding:clamp(32px,6vw,64px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-block:clamp(56px,8vw,96px)}
.cta h2{font-size:clamp(1.8rem,4.4vw,3.4rem);max-width:16ch}
.cta p{margin-top:12px;max-width:44ch}
@media (max-width:700px){.cta{grid-template-columns:1fr}}

/* Page projets */
.page-head{padding-block:clamp(40px,7vw,80px) 34px}
.page-head h1{font-size:clamp(2.4rem,6vw,5rem)}
.page-head p{margin-top:16px;color:var(--ink-2);max-width:52ch}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:24px}
.filters button{border:0;cursor:pointer;font:500 .8rem var(--f-mono);padding:7px 13px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Page projet */
.p-hero{padding-block:clamp(36px,6vw,70px) 28px}
.p-hero .back{display:inline-flex;gap:8px;align-items:center;text-decoration:none;margin-bottom:28px}
.p-hero h1{font-size:clamp(3rem,10vw,8rem);font-weight:780;text-transform:uppercase;letter-spacing:-.035em;line-height:.9}
.p-hero .tagline{font-family:var(--f-display);font-size:clamp(1.2rem,2.4vw,1.8rem);font-weight:500;max-width:30ch;margin-top:18px;line-height:1.2}
.p-hero .eyebrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cover{border-radius:var(--r);overflow:hidden;aspect-ratio:16/7;max-width:100%}
.cover svg{width:100%;height:100%;display:block}
@media (max-width:640px){.cover{aspect-ratio:4/3}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 24px;padding-block:40px;border-bottom:1.5px solid var(--ink)}
.facts dt{margin-bottom:6px}
.facts dd{margin:0;font-weight:500}
.facts .wide{grid-column:span 2}
.facts a{text-decoration:none;display:inline-flex;gap:6px;border-bottom:1.5px solid var(--ink);margin-right:14px}
@media (max-width:800px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.p-sec{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding-block:clamp(40px,6vw,72px);border-bottom:1px solid var(--line)}
.p-sec > .mono{padding-top:6px}
.p-sec .lead{font-size:1.15rem;max-width:62ch}
@media (max-width:760px){.p-sec{grid-template-columns:1fr;gap:14px}}
.quote{padding-block:clamp(48px,8vw,96px);text-align:center}
.quote blockquote{margin:0 auto;font-family:var(--f-display);font-size:clamp(1.6rem,3.8vw,3rem);font-weight:550;max-width:24ch;line-height:1.12;letter-spacing:-.02em}
.quote .mark{display:flex;justify-content:center;gap:6px;margin-bottom:22px}
.quote .mark i{width:18px;height:18px;display:block}
.feat{display:grid;gap:clamp(36px,6vw,64px)}
.feat article{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(20px,4vw,48px);align-items:center}
.feat article:nth-child(even) .vis{order:2}
.feat .vis{border-radius:18px;overflow:hidden;aspect-ratio:4/3}
.feat .vis svg{width:100%;height:100%;display:block}
.feat .n{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2)}
.feat h3{font-size:clamp(1.3rem,2.4vw,1.8rem);margin:8px 0 10px}
.feat p{color:var(--ink-2);max-width:46ch}
@media (max-width:760px){.feat article{grid-template-columns:1fr}.feat article:nth-child(even) .vis{order:0}}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:s}
.step{background:var(--paper);border-radius:16px;padding:18px;display:grid;gap:8px;align-content:start}
.step b{font-family:var(--f-display);font-size:1.05rem}
.step p{font-size:.92rem;color:var(--ink-2)}
.step .k{font:500 .72rem var(--f-mono);color:var(--ink-2)}
.step i{width:22px;height:22px;display:block}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.steps{grid-template-columns:1fr}}
.gallery{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.g-item{display:grid;gap:10px;align-content:start}
.g-item.desk{grid-column:span 8}.g-item.mob{grid-column:span 4}.g-item.idn{grid-column:span 12}
.g-item.solo{grid-column:span 12}
@media (max-width:760px){.g-item.desk,.g-item.mob{grid-column:span 12}}
.frame{background:var(--paper);border-radius:18px;padding:12px;box-shadow:inset 0 0 0 1px var(--line)}
.frame .bar{display:flex;gap:6px;padding:2px 4px 10px}
.frame .bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.screen{border-radius:10px;overflow:hidden;background:var(--cream)}
.screen svg{display:block;width:100%;height:auto}
.phone{max-width:240px;margin:0 auto;border-radius:30px;padding:10px;background:var(--ink)}
.phone .screen{border-radius:22px}
.idn-box{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sw{border-radius:14px;padding:14px;min-height:90px;display:flex;align-items:end;font:500 .75rem var(--f-mono)}
@media (max-width:640px){.idn-box{grid-template-columns:1fr}}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}
.metric{border-radius:16px;padding:20px;display:grid;gap:4px}
.metric b{font-family:var(--f-display);font-size:clamp(2rem,4vw,3rem);line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.metric span{font-size:.9rem}
@media (max-width:640px){.metrics{grid-template-columns:1fr}}
.pn{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid var(--ink)}
.pn a{padding:28px 0;text-decoration:none;display:grid;gap:6px}
.pn a + a{text-align:right;border-left:1.5px solid var(--ink);padding-left:20px}
.pn b{font-family:var(--f-display);font-size:clamp(1.4rem,3.4vw,2.6rem);text-transform:uppercase;letter-spacing:-.02em;font-weight:760}
.demo-note{display:inline-flex;gap:8px;align-items:center;font:500 .72rem var(--f-mono);background:var(--butter);padding:5px 10px;border-radius:999px}

/* À propos */
.about{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:clamp(28px,5vw,64px);padding-bottom:40px}
.portrait{border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;position:relative;max-width:100%}
.portrait svg{width:100%;height:100%;display:block}
.portrait span{position:absolute;left:14px;bottom:14px}
.about .bio p{font-size:1.12rem;max-width:58ch}
.about .bio p + p{margin-top:16px}
.tl{margin-top:36px;border-top:1.5px solid var(--ink)}
.tl div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.tl b{font-weight:600}
.tl p{color:var(--ink-2);font-size:.95rem}
.values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:36px}
.value{border-radius:16px;padding:20px;background:var(--paper);display:grid;gap:8px;align-content:start}
.value i{width:24px;height:24px;display:block}
.value b{font-family:var(--f-display);font-size:1.1rem}
.value p{font-size:.92rem;color:var(--ink-2)}
@media (max-width:820px){.about{grid-template-columns:1fr}.portrait{max-width:380px}.values{grid-template-columns:1fr}}
@media (max-width:480px){.tl div{grid-template-columns:1fr;gap:4px}}

/* Contact */
.contact{background:var(--peach);padding-block:clamp(48px,8vw,96px)}
.contact h1{font-size:clamp(2.6rem,7vw,5.8rem);font-weight:500;line-height:.98;letter-spacing:-.035em}
.contact h1 strong{font-weight:780;display:block}
.contact .intro{margin-top:22px;max-width:50ch;font-size:1.1rem}
.c-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);margin-top:44px}
@media (max-width:860px){.c-grid{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0 0 26px}
legend{padding:0;margin-bottom:12px}
.types{display:flex;gap:8px;flex-wrap:wrap}
.types label{position:relative}
.types input{position:absolute;opacity:0;inset:0;cursor:pointer}
.types span{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:500;font-size:.9rem;cursor:pointer;transition:background .2s}
.types span::before{content:"";width:9px;height:9px;border:1.5px solid var(--ink);border-radius:50%}
.types input:checked + span{background:var(--ink);color:var(--peach)}
.types input:checked + span::before{background:var(--peach);border-color:var(--peach);border-radius:2px;transform:rotate(45deg)}
.types input:focus-visible + span{outline:2px solid var(--ink);outline-offset:3px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px}
.fields .full{grid-column:1/-1}
.field{display:grid;gap:4px}
.field label{font:500 .74rem var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.field input,.field textarea{background:transparent;border:0;border-bottom:1.5px solid var(--ink);padding:8px 0;font:400 1.05rem var(--f-body);color:var(--ink);border-radius:0}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-bottom-width:3px}
.err{font-size:.85rem;min-height:1.2em;color:#7A1F2B}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.send{margin-top:26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ready{margin-top:22px;background:var(--paper);border-radius:16px;padding:18px;display:grid;gap:12px}
.coords{display:grid;gap:10px;align-content:start}
.coord{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;background:rgba(250,246,238,.55);border-radius:16px;padding:14px}
.coord i{width:40px;height:40px;border-radius:12px;background:var(--ink);display:grid;place-items:center}
.coord i::after{content:"";width:14px;height:14px;background:var(--peach)}
.coord .k{font:400 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.coord .v{font-weight:600;overflow-wrap:anywhere}
.coord button,.coord a.go{border:0;background:transparent;cursor:pointer;font:500 .75rem var(--f-mono);padding:8px;border-radius:8px;color:var(--ink);text-decoration:none}
.coord button:hover,.coord a.go:hover{background:rgba(33,31,44,.08)}

/* Footer */
footer{padding-block:40px 34px;border-top:1.5px solid var(--ink);margin-top:20px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer nav a{text-decoration:none}
footer nav a:hover{text-decoration:underline}
.is-contact + footer{margin-top:0}


.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>

function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
/* Composition géométrique (couvertures, visuels) */
function art(seed, pal, cols, rows){
  const r = rng(seed), colors = [...pal, COL.ink, COL.cream, COL.paper];
  const pick = () => colors[Math.floor(r()*colors.length)];
  let s = `<svg viewBox="0 0 ${cols*10} ${rows*10}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">`;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const X=x*10,Y=y*10,cx=X+5,cy=Y+5; let bg=pick(), fg=pick(); while(fg===bg) fg=pick();
    const rot = Math.floor(r()*4)*90, k = Math.floor(r()*6);
    s += `<rect x="${X}" y="${Y}" width="10" height="10" fill="${bg}"/>`;
    const g = d => `<g transform="rotate(${rot} ${cx} ${cy})">${d}</g>`;
    if(k===0) s += `<circle cx="${cx}" cy="${cy}" r="4.2" fill="${fg}"/>`;
    else if(k===1) s += g(`<path d="M${X} ${Y}A5 5 0 0 1 ${X} ${Y+10}Z" fill="${fg}"/><path d="M${X+10} ${Y}A5 5 0 0 0 ${X+10} ${Y+10}Z" fill="${fg}"/>`);
    else if(k===2) s += g(`<path d="M${X} ${Y}H${X+10}A10 10 0 0 1 ${X} ${Y+10}Z" fill="${fg}"/>`);
    else if(k===3) s += g(`<path d="M${X} ${Y+10}A5 5 0 0 1 ${X+10} ${Y+10}Z" fill="${fg}"/><circle cx="${cx}" cy="${Y+3}" r="1.6" fill="${fg}"/>`);
    else if(k===4) s += `<path d="M${cx} ${Y+1}L${X+9} ${cy}L${cx} ${Y+9}L${X+1} ${cy}Z" fill="${fg}"/>`;
  }
  return s + `</svg>`;
}

function startRot(){
  const box = document.getElementById("rot"); if(!box) return;
  const items = [...box.children]; let i = 0;
  /* largeur fixe = mot le plus long : le nombre de lignes ne change jamais */
  const fit = () => {
    box.style.width = ""; box.style.fontSize = "";
    const max = box.getBoundingClientRect().width, avail = box.parentElement.clientWidth;
    const k = max > avail ? avail / max : 1;
    if(k < 1) box.style.fontSize = k + "em";
    box.style.width = (max * k) + "px";
  };
  fit();
  window.onresize = fit;
  if(document.fonts) document.fonts.ready.then(fit);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const EASE = "transform .6s cubic-bezier(.65,0,.25,1)";
  rotTimer = setInterval(() => {
    if(document.hidden) return;
    const cur = items[i], nx = items[(i+1) % items.length];
    /* le mot suivant repart toujours d'en bas, sans transition */
    nx.style.transition = "none"; nx.style.transform = "translateY(115%)";
    void nx.offsetHeight;
    nx.style.transition = EASE; cur.style.transition = EASE;
    nx.style.transform = "translateY(0)"; cur.style.transform = "translateY(-115%)";
    i = (i+1) % items.length;
  }, 2600);
}

        <fieldset><legend class="mono" style="color:var(--ink)">${t("c_type")}</legend>
          <div class="types">${t("types").map((x,i)=>`<label><input type="radio" name="type" id="type-${i}" value="${esc(x)}"${i===0?" checked":""}><span>${esc(x)}</span></label>`).join("")}</div>
        </fieldset>
        <div class="fields">
          <div class="field"><label for="f-name">${t("c_name")} *</label><input id="f-name" name="name" autocomplete="name"><span class="err" id="e-name"></span></div>
          <div class="field"><label for="f-email">${t("c_email")} *</label><input id="f-email" name="email" type="email" autocomplete="email"><span class="err" id="e-email"></span></div>
          <div class="field full"><label for="f-company">${t("c_company")}</label><input id="f-company" name="company" autocomplete="organization"></div>
          <div class="field full"><label for="f-msg">${t("c_msg")} *</label><textarea id="f-msg" name="msg"></textarea><span class="err" id="e-msg"></span></div>
        </div>
        <input type="text" name="_gotcha" id="f-gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
        <div class="send"><button class="pill" type="submit" id="f-submit">${t("c_send")}</button></div>
        <div class="ready" id="sent" hidden><b style="font-family:var(--f-display);font-size:1.3rem">${t("sent_t")}</b><p>${t("sent_p")}</p></div>
        <div class="ready" id="ready" hidden><p><span id="err-pre"></span>${t("ready")}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="pill" id="mailto" href="#">${t("open_mail")}</a><button class="pill ghost" type="button" id="copymsg">${t("copy_msg")}</button></div></div>
      </form>
      <div class="coords">
        <div class="coord"><i></i><div><div class="k">${t("k_email")}</div><div class="v" id="mail-v">${esc(EMAIL)}</div></div><button type="button" data-copy="${esc(EMAIL)}">${t("copy")}</button></div>
        <div class="coord"><i style="border-radius:50%"></i><div><div class="k">${t("k_linkedin")}</div><div class="v">linkedin.com/in/…</div></div><a class="go" href="${LINKEDIN}" target="_blank" rel="noopener">${t("open")}</a></div>
        <div class="coord"><i style="border-radius:12px 12px 12px 50%"></i><div><div class="k">${t("k_github")}</div><div class="v">github.com/…</div></div><a class="go" href="${GITHUB}" target="_blank" rel="noopener">${t("open")}</a></div>
        <div class="coord"><i style="border-radius:50% 50% 12px 12px"></i><div><div class="k">${t("k_loc")}</div><div class="v">${t("loc")}</div></div></div>
      </div>
    </div>
  </div></section>`;
}

/* ============ ROUTEUR ============ */
const app = document.getElementById("app");
function route(){
  clearInterval(rotTimer); window.onresize = null;
  const h = location.hash.replace("#","");
  let html, nav = "";
  if(h==="projets"){ html = viewProjects(); nav="projets"; }
  else if(h==="a-propos"){ html = viewAbout(); nav="a-propos"; }
  else if(h==="contact"){ html = viewContact(); nav="contact"; }
  else if(h.startsWith("p-") && P.find(p=>p.slug===h.slice(2))){ html = viewProject(P.find(p=>p.slug===h.slice(2))); nav="projets"; }
  else html = viewHome();
  app.innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach(a => { a.classList.toggle("on", a.dataset.nav===nav); if(a.dataset.nav===nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  document.querySelector("footer").style.marginTop = nav==="contact" ? "0" : "";
  bind(); startRot();
  window.scrollTo({top:0, behavior:"instant"});
}
function applyStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = t(el.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang));
}
async function copyText(txt, btn){
  try{ await navigator.clipboard.writeText(txt); if(btn){ const o=btn.innerHTML; btn.textContent=t("copied"); setTimeout(()=>btn.innerHTML=o,1400);} }
  catch(e){ const el=document.getElementById("mail-v"); if(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} }
}
function bind(){
  app.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filter = b.dataset.filter; app.innerHTML = viewProjects(); bind(); });
  if(matchMedia("(hover: none)").matches) app.querySelectorAll(".sk").forEach(el => el.onclick = () => el.classList.toggle("open"));
  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(b.dataset.copy, b));
  const f = document.getElementById("cform"); if(!f) return;
  let body = "";
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const v = id => f.querySelector(id).value.trim();
    const name=v("#f-name"), mail=v("#f-email"), comp=v("#f-company"), msg=v("#f-msg"), type=f.querySelector("input[name=type]:checked").value;
    const errs = {name: name?"":t("e_name"), email: /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)?"":t("e_email"), msg: msg?"":t("e_msg")};
    Object.keys(errs).forEach(k => document.getElementById("e-"+k).textContent = errs[k]);
    if(Object.values(errs).some(Boolean)) return;
    const subject = `[${type}] ${name}${comp?" — "+comp:""}`;
    body = `${msg}\n\n${name}${comp?" · "+comp:""}\n${mail}`;
    const btn = document.getElementById("f-submit");
    if(FORM_ENDPOINT){
      const label = btn.textContent; btn.textContent = t("sending"); btn.disabled = true;
      try{
        const res = await fetch(FORM_ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
          body: JSON.stringify({type, name, email:mail, company:comp, message:msg, _subject:subject, _replyto:mail, _gotcha:v("#f-gotcha")})});
        if(!res.ok) throw new Error(res.status);
        f.querySelector(".fields").hidden = true; f.querySelector("fieldset").hidden = true; f.querySelector(".send").hidden = true;
        document.getElementById("ready").hidden = true; document.getElementById("sent").hidden = false;
        return;
      }catch(err){
        btn.textContent = label; btn.disabled = false;
        document.getElementById("err-pre").textContent = t("send_err") + " ";
      }
    }
    document.getElementById("mailto").href = `mailto:${EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    document.getElementById("ready").hidden = false;
    document.getElementById("copymsg").onclick = ev => copyText(`${subject}\n\n${body}`, ev.currentTarget);
  });
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try{ localStorage.setItem("pf-lang", lang); }catch(e){}
  applyStatic(); const y = scrollY; route(); window.scrollTo(0,y);
}));
window.addEventListener("hashchange", route);

applyStatic(); route();


</script>
